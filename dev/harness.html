<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VS Flow Designer harness</title>
  <style>
    /* A subset of VS Code's Dark Modern theme variables, so the webview renders as it does in VS Code. */
    :root {
      --vscode-font-family: -apple-system, "Segoe UI", sans-serif; --vscode-font-size: 13px;
      --vscode-editor-font-family: Consolas, monospace;
      --vscode-editor-background: #1f1f1f; --vscode-editor-foreground: #cccccc; --vscode-foreground: #cccccc;
      --vscode-editorWidget-background: #202020; --vscode-editorWidget-border: #454545;
      --vscode-descriptionForeground: #9d9d9d; --vscode-focusBorder: #0078d4;
      --vscode-sideBar-background: #181818; --vscode-panel-border: #2b2b2b;
      --vscode-editorGroupHeader-tabsBackground: #181818;
      --vscode-button-background: #0078d4; --vscode-button-foreground: #fff; --vscode-button-hoverBackground: #026ec1;
      --vscode-button-secondaryBackground: #313131; --vscode-button-secondaryForeground: #ccc; --vscode-button-secondaryHoverBackground: #3c3c3c;
      --vscode-input-background: #313131; --vscode-input-foreground: #ccc; --vscode-input-border: #3c3c3c;
      --vscode-dropdown-background: #313131; --vscode-dropdown-foreground: #ccc; --vscode-dropdown-border: #3c3c3c;
      --vscode-badge-background: #616161; --vscode-badge-foreground: #f8f8f8;
      --vscode-list-hoverBackground: #2a2d2e; --vscode-errorForeground: #f85149; --vscode-editorWarning-foreground: #cca700;
      --vscode-charts-green: #89d185; --vscode-charts-blue: #3794ff; --vscode-charts-red: #f14c4c;
      --vscode-textLink-foreground: #4daafc;
    }
  </style>
  <link rel="stylesheet" href="/media/designer.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.__posted = [];
    window.acquireVsCodeApi = () => ({
      postMessage(m) {
        window.__posted.push(m);
        if (m.type === 'ready') {
          fetch('/samples/Sample%20inbound%20flow.json').then((r) => r.text()).then((text) => {
            window.postMessage({ type: 'document', text, fileName: 'samples/Sample inbound flow.json', fromWebview: false }, '*');
          });
        } else if (m.type === 'edit') {
          window.postMessage({ type: 'document', text: JSON.stringify(m.flow, null, 2), fileName: 'samples/Sample inbound flow.json', fromWebview: true }, '*');
        }
      },
      getState() { return undefined; },
      setState() {},
    });
  </script>
  <script src="/dist/webview.js"></script>
</body>
</html>
